<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoice Generator — We App Testers</title>
<link rel="stylesheet" href="invoice.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- ════════════════════════════════════
     FORM PANEL  (only this is visible)
════════════════════════════════════ -->
<div id="form-panel">
  <h2>Invoice Generator — We App Testers</h2>

  <!-- ── Client Info ── -->
  <div class="form-section">
    <div class="form-section-title">Client Information</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Client Name *</label>
        <input id="inp-client-name" type="text" placeholder="e.g. Sumit Kumar">
      </div>
      <div class="form-group">
        <label>Client Email <span style="font-weight:400;text-transform:none;font-size:9px">(optional)</span></label>
        <input id="inp-client-email" type="email" placeholder="client@gmail.com">
      </div>
      <div class="form-group">
        <label>Client Phone <span style="font-weight:400;text-transform:none;font-size:9px">(optional)</span></label>
        <input id="inp-client-phone" type="text" placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label>Invoice Date</label>
        <input id="inp-date" type="date">
      </div>
    </div>
  </div>

  <!-- ── Invoice Number ── -->
  <div class="form-section">
    <div class="form-section-title">Invoice Number</div>
    <div class="inv-num-parts">
      <input id="inp-inv-p1" type="text" value="WAT" maxlength="8"
             style="width:70px;flex:none;text-align:center">
      <span class="inv-num-sep">–</span>
      <input id="inp-inv-p2" type="text" placeholder="App Code e.g. 27FB"
             style="flex:1">
      <span class="inv-num-sep">–</span>
      <input id="inp-inv-p3" type="text" maxlength="4"
             style="width:70px;flex:none;text-align:center">
    </div>
    <div class="inv-num-preview">Preview: <strong id="inv-num-preview">WAT-2026</strong></div>
  </div>

  <!-- ── App Testing Details ── -->
  <div class="form-section">
    <div class="form-section-title">App & Test Details</div>
    <div class="form-grid">
      <div class="form-group">
        <label>App Name</label>
        <input id="inp-app-name" type="text" placeholder="My App Name">
      </div>
      <div class="form-group">
        <label>Package / Play Store URL</label>
        <input id="inp-pkg-name" type="text"
               placeholder="com.example.app or Play Store URL">
      </div>
      <div class="form-group">
        <label>Testers Count</label>
        <input id="inp-testers" type="text" placeholder="12+ Testers">
      </div>
      <div class="form-group">
        <label>Testing Duration</label>
        <input id="inp-duration" type="text" placeholder="14 Days">
      </div>
    </div>
  </div>

  <!-- ── Services ── -->
  <div class="form-section">
    <div class="form-section-title">Services (add one or multiple)</div>
    <div id="service-list"></div>
    <div class="add-svc-row">
      <button id="btn-add-14day" class="btn-svc">+ 14-Day Testing</button>
      <button id="btn-add-custom" class="btn-svc">+ Custom Service</button>
    </div>
  </div>

  <!-- ── Package Price Preset ── -->
  <div class="form-section">
    <div class="form-section-title">Package Price Preset</div>
    <div id="preset-radios" class="preset-pills"></div>
    <div id="custom-price-wrap">
      <select id="inp-custom-currency">
        <option value="₹">₹ INR</option>
        <option value="$">$ USD</option>
      </select>
      <input id="inp-custom-price" type="number" min="0" step="0.01"
             placeholder="Enter amount">
    </div>
    <!-- Final agreed price -->
    <div class="agreed-row">
      <label>Final Agreed Price</label>
      <input id="inp-agreed-price" type="number" min="0" step="0.01"
             placeholder="Optional — if discount given">
      <span class="hint">Leave empty if no discount</span>
    </div>
  </div>

  <!-- ── Payment History ── -->
  <div class="form-section">
    <div class="form-section-title">
      Payment History
      <span style="font-weight:400;color:#bbb;font-size:9px;margin-left:6px">
        Leave empty = full payment assumed automatically
      </span>
    </div>
    <div id="payment-list"></div>
    <button id="btn-add-payment" class="btn-add">+ Add Payment Entry</button>
    <label class="manual-toggle">
      <input type="checkbox" id="chk-manual">
      Override Total Received Manually
    </label>
    <div id="manual-field">
      <span>Total Received:</span>
      <input id="inp-manual-received" type="number" min="0" step="0.01"
             placeholder="Amount">
    </div>
  </div>

  <!-- ── Notes ── -->
  <div class="form-section">
    <div class="form-section-title">Notes</div>
    <div class="form-group">
      <textarea id="inp-notes" rows="2"></textarea>
    </div>
  </div>
</div><!-- /form-panel -->

<!-- Download button -->
<button id="btn-download">⬇ &nbsp;Download Invoice PDF</button>

<script src="invoice.js"></script>
</body>
</html>
